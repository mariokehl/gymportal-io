openapi: 3.0.3
info:
  title: gymportal.io Agent API
  version: 1.0.0
  description: >
    Interface for AI agents and automations of one gym. The gym comes from the
    token, every area has its own read ability.
servers:
  - url: /api/v1/agent
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    memberId: { name: memberId, in: path, required: true, schema: { type: integer } }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Ok: { description: "success=true, payload under data" }
    Unauthenticated: { description: "Token missing, unknown, revoked or expired", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: The token lacks the ability (error.required_ability) }
    NotFound: { description: No such member in this gym }
paths:
  /health:
    get: { summary: Gym and abilities of the token, responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthenticated' } } }
  /plans:
    get: { summary: Active plans, x-ability: plans.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members:
    get:
      summary: Search members
      x-ability: members.read
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /members/lookup:
    get:
      summary: Find exactly one member (match = unique, none, ambiguous)
      x-ability: members.read
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: member_number, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: No search criterion } }
  /members/{memberId}:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: Master data, x-ability: members.read, responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /members/{memberId}/contract:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: "Contract with cancellation date, notice period, pause, withdrawal", x-ability: contracts.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members/{memberId}/access:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: "Access: should it work by the scanner rules (blockers), and the last denied scan with the reason the portal stored", x-ability: access.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members/{memberId}/access-attempts:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get:
      summary: "Scans and station check-ins, granted or denied, with the portal's own denial reason (also those at other locations of the organisation)"
      x-ability: access.read
      parameters:
        - { name: result, in: query, schema: { type: string, enum: [all, denied, granted], default: all } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200 } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: Unknown value for result } }
  /members/{memberId}/check-ins:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: Recent visits, x-ability: access.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members/{memberId}/payments:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: Payments with the sum of the failed ones, x-ability: payments.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /occupancy:
    get:
      summary: Visits by weekday and hour
      x-ability: stats.read
      parameters: [ { name: days, in: query, schema: { type: integer, default: 56 } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /stats:
    get: { summary: "Key figures of the gym (revenue only with payments.read)", x-ability: stats.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /insights/inactive-members:
    get:
      summary: Members with a running contract and no visit for N days
      x-ability: stats.read
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
