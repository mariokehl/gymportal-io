stages:
  - test

unit-tests:
  stage: test
  image:
    name: serversideup/php:8.2-cli
    # Runs as www-data by default, which may not install PHP extensions.
    docker:
      user: root
  before_script:
    # The widget views format currency with NumberFormatter, so the intl
    # extension is required. It is not part of the base image.
    - install-php-extensions intl
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --no-progress --no-scripts
    - php artisan package:discover --ansi
    - php artisan key:generate
  script:
    - php artisan config:clear
    - php artisan test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/

js-tests:
  stage: test
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - node_modules/
